services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ant_iam
      POSTGRES_USER: ant_iam
      POSTGRES_PASSWORD: ant_iam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ant_iam -d ant_iam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
