server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_read_timeout 120s;

    # 页面 CSP 与控制台「通用安全」设置保持一致：每次返回 HTML 前向后端读取当前策略。
    location = /_csp {
        internal;
        proxy_pass http://iam-api:8080/api/v1/security-headers;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /oauth2/consent {
        auth_request /_csp;
        auth_request_set $iam_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $iam_csp always;
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://iam-api:8080;
    }

    location /scim/ {
        proxy_pass http://iam-api:8080;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://iam-api:8080;
    }

    location /oauth2/ {
        proxy_pass http://iam-api:8080;
    }

    location /saml2/ {
        proxy_pass http://iam-api:8080;
    }

    location /cas/ {
        proxy_pass http://iam-api:8080;
    }

    location /jwt/ {
        proxy_pass http://iam-api:8080;
    }

    # Vite 构建产物是带 hash 的静态资源，不需要逐个请求 CSP。
    location /assets/ {
        try_files $uri =404;
    }

    # 文档站（VitePress 构建产物）带 hash 的静态资源，可以长期缓存。
    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 文档站点是独立静态页面，不能回退到前端 index.html，否则会被前端路由带去登录页。
    location /docs/ {
        auth_request /_csp;
        auth_request_set $iam_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $iam_csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location / {
        auth_request /_csp;
        auth_request_set $iam_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $iam_csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
