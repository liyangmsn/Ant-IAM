spring:
  application:
    name: iam
  datasource:
    url: ${IAM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ant_iam}
    username: ${IAM_DATASOURCE_USERNAME:ant_iam}
    password: ${IAM_DATASOURCE_PASSWORD:ant_iam}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
  threads:
    virtual:
      enabled: true
server:
  port: ${IAM_PORT:8080}
  # 部署在 nginx / Ingress 之后时，按 X-Forwarded-* 头还原对外协议、域名与端口。
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iam:
  # 对外访问地址（OIDC issuer / SAML entityID / JWT iss），为空时按请求地址推导。
  issuer: ${IAM_ISSUER:}
  geoip:
    database-path: ${IAM_GEOIP_DATABASE_PATH:}

sms:
  config-type: yaml
  blends:
    fixed-code:
      supplier: fixed-code
      factory: com.antiam.sms.fixed.FixedCodeSmsFactory
      code: ${IAM_SMS_FIXED_CODE:666666}
