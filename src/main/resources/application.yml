spring:
  application:
    name: ant-iam
  datasource:
    url: ${ANT_IAM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ant_iam}
    username: ${ANT_IAM_DATASOURCE_USERNAME:ant_iam}
    password: ${ANT_IAM_DATASOURCE_PASSWORD:ant_iam}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
  security:
    user:
      name: ${ANT_IAM_ADMIN_USERNAME:admin}
      password: ${ANT_IAM_ADMIN_PASSWORD:admin123456}

server:
  port: ${ANT_IAM_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ant-iam:
  sms:
    fixed-code: ${ANT_IAM_SMS_FIXED_CODE:666666}
    code-ttl-seconds: ${ANT_IAM_SMS_CODE_TTL_SECONDS:300}
